name: 家計データ変換

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 家計.xlsmをJSONへ変換
        run: python convert_kakei.py

      - name: JSONをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kakei.json
          git diff --cached --quiet || git commit -m "家計データをJSONに変換"
          git push
