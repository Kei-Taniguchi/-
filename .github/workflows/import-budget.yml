name: Import household budget

on:
  push:
    branches: [main]
    paths:
      - '家計.xlsx'
      - 'scripts/import_budget.py'
      - '.github/workflows/import-budget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Excel parser
        run: python -m pip install --upgrade pip openpyxl

      - name: Convert Excel to JSON
        run: python scripts/import_budget.py

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/budget-data.json
          git diff --cached --quiet && echo 'No data changes' || git commit -m 'chore: update generated budget data'
          git push
